  </g>
  <path d="M 0 0 L 86.0 149.0 A 172 172 0 0 1 -86.0 149.0 Z" fill="#ffd5e1" stroke="#ffffff" stroke-width="3" />
  <g transform="translate(0.0, 110.0) rotate(180.0)">
