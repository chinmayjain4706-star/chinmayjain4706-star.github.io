    <text x="0" y="16.5" class="wheel-text">favourite</text>
  </g>
  <path d="M 0 0 L -172.0 0.0 A 172 172 0 0 1 -86.0 -149.0 Z" fill="#ffd5e1" stroke="#ffffff" stroke-width="3" />
  <g transform="translate(-95.3, -55.0) rotate(300.0)">
    <text x="0" y="-16.5" class="wheel-text">you turn</text>
    <text x="0" y="0.0" class="wheel-text">small</text>
    <text x="0" y="16.5" class="wheel-text">moments</text>
  </g>
  <path d="M 0 0 L -86.0 -149.0 A 172 172 0 0 1 86.0 -149.0 Z" fill="#dfccfc" stroke="#ffffff" stroke-width="3" />
  <g transform="translate(-0.0, -110.0) rotate(360.0)">
    <text x="0" y="-16.5" class="wheel-text">you're my</text>
    <text x="0" y="0.0" class="wheel-text">quiet and</text>
    <text x="0" y="16.5" class="wheel-text">my happy</text>
  </g>
  <path d="M 0 0 L 86.0 -149.0 A 172 172 0 0 1 172.0 -0.0 Z" fill="#ffd5e1" stroke="#ffffff" stroke-width="3" />
  <g transform="translate(95.3, -55.0) rotate(420.0)">
