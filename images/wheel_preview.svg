    <text x="0" y="0.0" class="wheel-text">you feels</text>
    <text x="0" y="16.5" class="wheel-text">like home</text>
  </g>
  <path d="M 0 0 L -86.0 149.0 A 172 172 0 0 1 -172.0 0.0 Z" fill="#dfccfc" stroke="#ffffff" stroke-width="3" />
  <g transform="translate(-95.3, 55.0) rotate(240.0)">
