    <text x="0" y="0.0" class="wheel-text">want to be</text>
    <text x="0" y="16.5" class="wheel-text">better</text>
  </g>
  <circle cx="0" cy="0" r="172" fill="none" stroke="#ffffff" stroke-width="6" />
  <circle cx="0" cy="0" r="30" fill="#ffffff" stroke="#ea708e" stroke-width="3" />
  <text x="0" y="2" font-size="18" fill="#e63946" text-anchor="middle" dominant-baseline="middle">♡</text>
