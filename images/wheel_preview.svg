<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <style>
      .wheel-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 12px; fill: #3a1c4e; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <g transform="translate(180, 180)">
  <path d="M 0 0 L 172.0 0.0 A 172 172 0 0 1 86.0 149.0 Z" fill="#dfccfc" stroke="#ffffff" stroke-width="3" />
  <g transform="translate(95.3, 55.0) rotate(120.0)">
    <text x="0" y="-16.5" class="wheel-text">it's you.</text>
